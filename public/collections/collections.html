<!doctype html>
<html>
  <head>
    <title>Collections</title>
    <link rel="stylesheet" href="collections.css" />
  </head>

  <body>
    <div class="container">
      <!-- Header -->
      <div class="top-bar">
        <h1>📁 My Collections</h1>

        <button onclick="showForm()">+ New Collection</button>
      </div>

      <!-- Create Collection Form -->

      <div id="collectionForm" class="form-container" style="display: none">
        <h2>Create Collection</h2>

        <div class="form-group">
          <label>Collection Name</label>

          <input
            type="text"
            id="collectionName"
            placeholder="Machine Learning"
          />
        </div>

        <div class="form-group">
          <label>Description</label>

          <textarea
            id="collectionDescription"
            placeholder="Collection Description"
          ></textarea>
        </div>

        <div class="form-group">
          <label>Image URL (Optional)</label>

          <input type="text" id="collectionImage" placeholder="https://..." />
        </div>

        <div class="btn-group">
          <button onclick="saveCollection()">Save Collection</button>

          <button onclick="hideForm()">Cancel</button>
        </div>
      </div>

      <!-- Collection Cards -->

      <div id="collectionsGrid" class="grid"></div>
    </div>

    <script src="collections.js"></script>
  </body>
</html>
